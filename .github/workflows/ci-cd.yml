name: build-and-deploy

# app/ 소스가 바뀔 때만 트리거 (manifests/의 CI 커밋이 무한 루프로 다시 트리거되지 않도록
# paths를 app/**로 제한). 수동 실행도 허용.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # azure/login OIDC 토큰 발급용
  contents: write   # manifests/ 커밋-백 용

env:
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}   # 예: cicdpocacr.azurecr.io (Settings > Variables)
  IMAGE_NAME: employee-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 시크릿(client secret) 없이 GitHub OIDC 토큰 <-> Azure 관리 ID 교환으로 로그인.
      # Azure 쪽 federated credential은 Azure/environments/cicd-poc의
      # azurerm_federated_identity_credential 리소스가 구성한다.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build and push image
        id: build
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}"
          docker build --build-arg APP_VERSION="$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" app/
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ArgoCD가 감시하는 manifests/kustomization.yaml에 새 이미지 태그를 커밋.
      # 이 커밋이 곧 "배포 트리거"이며, ArgoCD가 polling(기본 3분) 또는 webhook으로
      # 감지해 자동 동기화한다 (argocd/application.yaml의 syncPolicy.automated).
      - name: Update image tag in manifests
        run: |
          sed -i "s|newName: .*|newName: ${ACR_LOGIN_SERVER}/${IMAGE_NAME}|" manifests/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${{ steps.build.outputs.tag }}|" manifests/kustomization.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/kustomization.yaml
          git diff --cached --quiet && echo "no manifest change" && exit 0
          git commit -m "deploy: ${IMAGE_NAME}:${{ steps.build.outputs.tag }} [skip ci]"
          git push
