apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app
  namespace: cicd-poc
  labels:
    app: employee-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-app
  template:
    metadata:
      labels:
        app: employee-app
    spec:
      containers:
        - name: employee-app
          # image 이름/태그는 kustomization.yaml의 images: 로 덮어씀.
          # CI 파이프라인이 `kustomize edit set image`로 태그를 갱신하고 커밋한다.
          image: employee-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: employee-app-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
